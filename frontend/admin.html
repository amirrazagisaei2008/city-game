<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>پنل مدیریت شهرساز</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet" />
<style>
  :root { --ink:#0e1a2b; --ink-2:#16263d; --sand:#f2e8d5; --dim:#b9ad97; --brick:#e0703a; --mint:#5fbfa3; --line:rgba(242,232,213,.12); }
  * { box-sizing: border-box; }
  body { margin:0; padding:14px; background:var(--ink); color:var(--sand); font-family:"Vazirmatn",system-ui,sans-serif; }
  h1 { font-size:20px; margin:0 0 12px; }
  .stats { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:12px; }
  .card { background:var(--ink-2); border:1px solid var(--line); border-radius:12px; padding:10px; }
  .card small { color:var(--dim); font-size:12px; }
  .card strong { display:block; font-size:20px; margin-top:4px; direction:ltr; text-align:right; }
  .search { display:flex; gap:8px; margin-bottom:10px; }
  input { flex:1; background:var(--ink-2); border:1px solid var(--line); color:var(--sand); border-radius:10px; padding:10px; font-family:inherit; font-size:14px; }
  button { border:0; border-radius:10px; padding:8px 10px; font-family:inherit; font-weight:700; background:var(--mint); color:var(--ink); cursor:pointer; font-size:13px; }
  button.danger { background:#c0392b; color:#fff; }
  button.warn { background:var(--brick); }
  .user { background:var(--ink-2); border:1px solid var(--line); border-radius:12px; padding:10px; margin-bottom:8px; }
  .user .head { display:flex; justify-content:space-between; gap:8px; }
  .user .meta { font-size:12px; color:var(--dim); margin:4px 0 8px; direction:ltr; text-align:right; }
  .actions { display:flex; flex-wrap:wrap; gap:6px; }
  .tag { font-size:11px; padding:2px 8px; border-radius:99px; background:var(--mint); color:var(--ink); }
  .tag.ban { background:#c0392b; color:#fff; }
  .toast { position:fixed; top:10px; left:50%; transform:translateX(-50%); background:var(--sand); color:var(--ink); padding:8px 14px; border-radius:10px; display:none; font-size:13px; }
</style>
</head>
<body>

<h1>پنل مدیریت</h1>

<div class="stats">
  <div class="card"><small>کل بازیکنان</small><strong id="sPlayers">-</strong></div>
  <div class="card"><small>VIP فعال</small><strong id="sVip">-</strong></div>
  <div class="card"><small>مسدود</small><strong id="sBanned">-</strong></div>
  <div class="card"><small>کل پیام‌ها</small><strong id="sMsgs">-</strong></div>
</div>

<div class="search">
  <input id="q" placeholder="جستجو با نام یا شناسه تلگرام" />
  <button id="searchBtn">جستجو</button>
</div>

<div id="users"></div>
<div class="toast" id="toast"></div>

<script>
// ===== تنظیمات: آدرس Worker خودت =====
const API_BASE = 'https://city-game-api.YOUR-SUBDOMAIN.workers.dev';

const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const initData = tg?.initData || '';
const $ = (id) => document.getElementById(id);

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.style.display = 'none'), 1800);
}

async function api(path, body) {
  const res = await fetch(API_BASE + path, {
    method: body ? 'POST' : 'GET',
    headers: { 'X-Init-Data': initData, ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.status);
  return data;
}

async function loadStats() {
  const s = await api('/api/admin/stats');
  $('sPlayers').textContent = s.players;
  $('sVip').textContent = s.vip;
  $('sBanned').textContent = s.banned;
  $('sMsgs').textContent = s.messages;
}

async function loadUsers() {
  const q = $('q').value.trim();
  const { users } = await api('/api/admin/users?q=' + encodeURIComponent(q));
  const box = $('users');
  box.innerHTML = '';
  for (const u of users) {
    const vipOn = u.vip_until > Date.now();
    const el = document.createElement('div');
    el.className = 'user';
    el.innerHTML = `
      <div class="head">
        <b>${escapeHtml(u.name)}</b>
        <span>
          ${vipOn ? '<span class="tag">VIP</span>' : ''}
          ${u.banned ? '<span class="tag ban">مسدود</span>' : ''}
        </span>
      </div>
      <div class="meta">id: ${u.id} | coins: ${Math.floor(u.coins)}</div>
      <div class="actions">
        <button data-act="coins">تنظیم سکه</button>
        <button data-act="vip" class="warn">افزودن روز VIP</button>
        <button data-act="unvip">لغو VIP</button>
        <button data-act="ban" class="${u.banned ? '' : 'danger'}">${u.banned ? 'رفع مسدودی' : 'مسدود کردن'}</button>
      </div>`;
    el.querySelectorAll('button').forEach((b) => (b.onclick = () => act(u, b.dataset.act)));
    box.appendChild(el);
  }
  if (!users.length) box.innerHTML = '<div class="card">کاربری پیدا نشد</div>';
}

async function act(u, what) {
  try {
    if (what === 'coins') {
      const v = prompt('مقدار جدید سکه:', Math.floor(u.coins));
      if (v === null) return;
      await api('/api/admin/user', { id: u.id, coins: Number(v) });
    } else if (what === 'vip') {
      const d = prompt('چند روز VIP اضافه شود؟', '30');
      if (d === null) return;
      await api('/api/admin/user', { id: u.id, vip_days: Number(d) });
    } else if (what === 'unvip') {
      await api('/api/admin/user', { id: u.id, vip_days: -1 });
    } else if (what === 'ban') {
      await api('/api/admin/user', { id: u.id, banned: !u.banned });
    }
    toast('ذخیره شد');
    loadUsers(); loadStats();
  } catch (err) { toast('خطا: ' + err.message); }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

$('searchBtn').onclick = loadUsers;
$('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') loadUsers(); });

(async function init() {
  if (!initData) { toast('این صفحه باید از داخل تلگرام باز شود'); return; }
  try { await loadStats(); await loadUsers(); }
  catch (err) { toast(err.message === '403' || err.message === 'forbidden' ? 'دسترسی ادمین ندارید' : 'خطا در بارگذاری'); }
})();
</script>
</body>
</html>
